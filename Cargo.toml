[workspace]
resolver = "3"
members = [
    "crates/handl-ext",
    "crates/handl-language",
    "crates/handl-value",
    "crates/bytes",
    "crates/cmp",
    "crates/combinators",
    "crates/error",
    "crates/mood",
    "crates/obj",
    "crates/ops",
    "crates/type",
    "crates/prim",
    "crates/prim-handl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/handl-lang/kernel"

[workspace.dependencies]
libloading = "0.8"
hnl-engine = { git = "https://github.com/handl-lang/engine", branch = "main" }
serde = "1"
serde_json = "1"
thiserror = "2"

[profile.dev]
opt-level = 1

[patch."https://github.com/handl-lang/engine"]
hnl-engine = { path = "../engine" }
