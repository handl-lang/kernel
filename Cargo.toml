[workspace]
resolver = "3"
members = [
    "crates/handl-ext",
    "crates/defining-handl",
    "crates/handl-language",
    "crates/handl-value",
    "crates/bytes",
    "crates/cmp",
    "crates/combinators",
    "crates/error",
    "crates/mood",
    "crates/obj",
    "crates/ops",
    "crates/type",
    "crates/prim",
    "crates/prim-handl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/handl-lang/kernel"

[workspace.dependencies]
libloading = "0.8"
hnl-engine = { git = "https://github.com/handl-lang/engine", branch = "main" }
serde = "1"
serde_json = "1"
thiserror = "2"

[profile.dev]
opt-level = 1

[patch."https://github.com/handl-lang/engine"]
hnl-engine = { path = "../engine" }

# The floor-lib crates (`handl-lib-*`) and `handl-value`/`handl-language`
# declare `git = handl-lang/kernel` deps so they also build as standalone
# packages (their own `[patch]` tables cover that case). As workspace
# members those tables are ignored, which would resolve a *second* copy
# of each kernel crate from git — pinned at whatever sha the lock last
# recorded — and drift against the members. Patch the kernel source back
# to the members so the workspace always builds one coherent copy.
[patch."https://github.com/handl-lang/kernel"]
handl-ext = { path = "crates/handl-ext" }
handl-language = { path = "crates/handl-language" }
handl-value = { path = "crates/handl-value" }
handl-lib-bytes = { path = "crates/bytes" }
handl-lib-cmp = { path = "crates/cmp" }
handl-lib-combinators = { path = "crates/combinators" }
handl-lib-error = { path = "crates/error" }
handl-lib-mood = { path = "crates/mood" }
handl-lib-obj = { path = "crates/obj" }
handl-lib-ops = { path = "crates/ops" }
handl-lib-prim = { path = "crates/prim" }
handl-lib-prim-handl = { path = "crates/prim-handl" }
handl-lib-type = { path = "crates/type" }

# --- ADR-0128 sibling-checkout patches: the member crates dep on the
# handl-lang repos via `git` so they also build standalone; the
# workspace root resolves them all to the local checkouts.
