# bupha.toml — committed CI manifest for handl-lang/kernel.
#
# The gate is the peregrin campaign in workflows/gate.yaml — ci.sh is
# retired fleet-wide, so the runner executes the campaign in the pushed
# worktree and checks .ci-result.json's conclusion (same contract as
# handl-lang/workspace). Merge the [[repos]] entry into the shared
# watcher (~/.config/bupha/bupha.toml) or run:
# bupha watch --config bupha.toml
[[repos]]
name = "handl-lang/kernel"
dir = "~/GitHub/handl-lang/kernel"
branch = "refs/heads/main"
  [repos.runner]
  kind = "script"
  cmd = "export PATH=\"$HOME/.local/bin:$PATH\"; GATE_REPO=\"$PWD\" GATE_RESULTS=\"$PWD/.gate-results.jsonl\" peregrin campaign run workflows/gate.yaml --result .ci-result.json && jq -e '.conclusion == \"success\"' .ci-result.json"
  cancel_running = true

[trigger]
kind = "github"
listen = "127.0.0.1:29173"
secret_env = "BUPHA_WEBHOOK_SECRET"

# global runner — same shell cmd; a merged watcher overrides it per repo
# anyway ([repo.runner] is a full replacement).
[runner]
kind = "script"
cmd = "export PATH=\"$HOME/.local/bin:$PATH\"; GATE_REPO=\"$PWD\" GATE_RESULTS=\"$PWD/.gate-results.jsonl\" peregrin campaign run workflows/gate.yaml --result .ci-result.json && jq -e '.conclusion == \"success\"' .ci-result.json"
token_env = "BUPHA_TOKEN"

[status]
kind = "github"
context = "ci/bupha"

[tunnel]
provider = "cloudflared"
name = "bupha"
local_url = "http://127.0.0.1:29173"
public_url = "https://ci.luisfuturist.com"   # hooks land at <url>/hook

[worktree]
# Runs land at <base>-handl-lang-kernel-<sha12>. Same base the shared
# watcher uses, so history.jsonl stays in one place.
base = "~/dagger/worktrees/bupha"
