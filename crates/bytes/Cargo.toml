[package]
name = "handl-lib-bytes"
version = "0.1.0"
edition = "2024"
description = "Byte-buffer primitives for the `Bytes` scalar type (8 FFI atoms)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/handl-lang/lib-bytes"

[dependencies]
# ADR-0128 §Resolution: platform + lib-ops come from the sibling checkouts for
# local development (see the `[patch]` tables); CI resolves the git sources.
handl-platform = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-value = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-plugin-lib-handl = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-lib-ops = { git = "https://github.com/handl-lang/kernel", branch = "main" }
serde_json = "1"

[patch."https://github.com/handl-lang/kernel"]
handl-value = { path = "../kernel/crates/handl-value" }

[patch."https://github.com/handl-lang/lib-ops"]
handl-lib-ops = { path = "../kernel/crates/ops" }

[patch."https://github.com/handl-lang/host"]
handl-platform = { path = "../host/crates/platform" }
handl-plugin-lib-handl = { path = "../host/crates/plugin-lib-handl" }
