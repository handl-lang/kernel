[package]
name = "handl-language"
version.workspace = true
edition.workspace = true
description = "The `Language` data schema and staged `lex`/`parse`/`eval` dispatch signatures for the HAndL platform (ADR-0044)."
license.workspace = true
repository.workspace = true

[dependencies]
hnl-engine = { git = "https://github.com/handl-lang/engine", branch = "main" }
handl-value = { git = "https://github.com/handl-lang/kernel", branch = "main" }
rustc-hash = "2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }