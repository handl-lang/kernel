[package]
name = "handl-lib-obj"
version = "0.1.0"
edition = "2024"
description = "obj: Handl stdlib port (ADR-0128 split)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/handl-lang/lib-obj"

[dependencies]
handl-platform = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-plugin-lib-handl = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-lib-ops = { git = "https://github.com/handl-lang/kernel", branch = "main" }
serde_json = "1"

[patch."https://github.com/handl-lang/lib-ops"]
handl-lib-ops = { path = "../kernel/crates/ops" }

[patch."https://github.com/handl-lang/host"]
handl-platform = { path = "../host/crates/platform" }
handl-plugin-lib-handl = { path = "../host/crates/plugin-lib-handl" }
