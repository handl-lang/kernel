[package]
name = "handl-lib-ops"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Shared op helpers for handl lib-* crates (throwaway: vanishes when ops are handl)."
license.workspace = true
repository = "https://github.com/handl-lang/lib-ops"

[dependencies]
handl-ops = { git = "https://github.com/handl-lang/kernel", branch = "main" }
serde_json = "1"

[patch."https://github.com/handl-lang/kernel"]
handl-ops = { path = "../handl-ops" }
