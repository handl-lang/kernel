[package]
name = "handl-lib-ops"
version = "0.1.0"
edition = "2024"
description = "Shared op helpers for handl lib-* crates (throwaway: vanishes when ops are handl)."
license = "MIT"
repository = "https://github.com/handl-lang/lib-ops"

[dependencies]
serde_json = "1"
# ADR-0128 §Resolution: the platform crates come from the sibling checkout for
# local development (see the `[patch]` table); CI resolves the git source.
handl-platform = { git = "https://github.com/handl-lang/host", branch = "main" }

[patch."https://github.com/handl-lang/host"]
handl-platform = { path = "../host/crates/platform" }
