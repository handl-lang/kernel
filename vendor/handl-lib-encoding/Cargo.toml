[package]
name = "handl-lib-encoding"
version = "0.1.0"
edition = "2024"
description = "encoding: Handl stdlib port + the Encoder/Decoder/Encoding trait (ADR-0128 split)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/handl-lang/lib-encoding"

# Vendored at lib-encoding@bfe791e — the last rev that shipped the Rust
# shell (dropped upstream in ADR-0161) — because handl-lib-base64 still
# declares a `branch = "main"` git dep on this crate. Remove when the
# dead dep is removed upstream. Deps below are git-declared like the
# upstream manifest; the workspace root [patch] tables resolve them to
# sibling checkouts.
[dependencies]
handl-platform = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-plugin-lib-handl = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-lib-ops = { git = "https://github.com/handl-lang/kernel", branch = "main" }
serde_json = "1"
thiserror = "2"
