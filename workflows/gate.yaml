# workflows/gate.yaml — per-push gate for handl-lang/kernel.
#
# Composed entirely from the handl-gates bundle (handl-lang/workspace
# workflows/): gate.init validates inputs → gate.ensure restores the
# worktree sibling layout + shared CARGO_TARGET_DIR env file (no-op in
# a main checkout) → gate.run is the lib/rust-check-test.node.yml
# fragment — the faithful scripts/ci.sh "check + test" port (cargo
# check --workspace --all-targets; cargo test --workspace
# --no-fail-fast, memory-capped threads, sccache/auth env) →
# gate.report reads the results record for the terminal verdict.
#
# Bupha/the fleet runner invokes:
#
#   GATE_REPO="$PWD" GATE_RESULTS="$PWD/.gate-results.jsonl" \
#     peregrin campaign run workflows/gate.yaml --result .ci-result.json
#
# Verdict: .ci-result.json `.conclusion` == "success" (result: rules map
# gate.pass/gate.fail + failure events).
name: gate-kernel

result:
  - event: gate.pass
    conclusion: success
  - event: gate.fail
    conclusion: failure
  - event: gate.failed
    conclusion: failure
  - event: gate.init.failed
    conclusion: failure
  - event: ensure.failed
    conclusion: failure

capabilities:
  env:
    - GATE_REPO
    - GATE_RESULTS
    - CI_JOBS
    - CI_BUILD_JOBS
    - HANDL_TOKEN
    - BUPHA_TOKEN

nodes:
  # --- init: validate inputs, fresh results file --------------------
  - id: gate.init
    driver: shell
    on: [start]
    emits: [gate.due, gate.init.failed]
    params:
      cmd: >-
        set -u;
        REPO="${config.gate.repo:-${env("GATE_REPO","")}}";
        [ -n "$REPO" ] || { echo "gate.repo is required — set GATE_REPO or config.gate.repo to an absolute checkout path"; exit 1; };
        [ -d "$REPO" ] || { echo "no such directory: $REPO"; exit 1; };
        [ -f "$REPO/Cargo.toml" ] || { echo "no Cargo.toml in $REPO — gate target moved?"; exit 1; };
        RES="${config.gate.results:-${env("GATE_RESULTS","$HOME/.local/share/handl-gates/kernel.results.jsonl")}}";
        mkdir -p "$(dirname "$RES")";
        : > "$RES";
        echo "gate-kernel: repo=$REPO results=$RES"
      timeout: 60
      emit:
        "0": gate.due
        default: gate.init.failed

  # --- ensure: sibling layout + shared cargo target env ------------
  - include: tamias:handl-gates@0.3.5//lib/ensure-siblings.node.yml
    id: gate.ensure
    on: [gate.due]
    emits: [ensure.done, ensure.failed]
    params:
      repo: '${config.gate.repo:-${env("GATE_REPO","")}}'
      emit:
        "0": ensure.done
        default: ensure.failed

  # --- run: the ci.sh check+test lane, as a bundle fragment ---------
  - include: tamias:handl-gates@0.3.5//lib/rust-check-test.node.yml
    id: gate.run
    on: [ensure.done]
    emits: [gate.done, gate.failed]
    params:
      repo: '${config.gate.repo:-${env("GATE_REPO","")}}'
      results: '${config.gate.results:-${env("GATE_RESULTS","$HOME/.local/share/handl-gates/kernel.results.jsonl")}}'
      emit:
        "0": gate.done
        default: gate.failed

  # --- report: terminal verdict from the results record -------------
  - id: gate.report
    driver: shell
    on: [gate.done, gate.failed]
    emits: [gate.pass, gate.fail]
    params:
      cmd: >-
        set -u;
        F="${config.gate.results:-${env("GATE_RESULTS","$HOME/.local/share/handl-gates/kernel.results.jsonl")}}";
        [ -s "$F" ] || { echo "no results record — gate produced nothing"; exit 1; };
        line=$(tail -n 1 "$F");
        rc=$(printf '%s' "$line" | sed -n 's/.*"rc":\([0-9][0-9]*\).*/\1/p');
        echo "gate-kernel verdict: $line";
        [ "${rc:-1}" = "0" ]
      timeout: 60
      emit:
        "0": gate.pass
        default: gate.fail
